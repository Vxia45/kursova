services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: kursova
      MYSQL_USER: kursova_user
      MYSQL_PASSWORD: kursova_password
      MYSQL_ROOT_PASSWORD: root_password_1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kursova_user", "-pkursova_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: kursova
      DB_USER: kursova_user
      DB_PASSWORD: kursova_password
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
